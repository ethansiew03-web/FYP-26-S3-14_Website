<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioAudit — Sign Up</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap');

    :root {
      --bg: #05060a;
      --bg-panel: #14161c;
      --orange: #ff5e3a;
      --cyan: #4de3d1;
      --text: #e8f3e6;
      --text-dim: #9aa0a6;
      --border: #2a2d35;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* starfield */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 90px 120px, #fff, transparent),
        radial-gradient(1px 1px at 160px 60px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 230px 180px, #fff, transparent),
        radial-gradient(1px 1px at 300px 40px, #fff, transparent),
        radial-gradient(1px 1px at 40px 220px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 380px 100px, #fff, transparent),
        radial-gradient(1px 1px at 140px 260px, #fff, transparent);
      background-repeat: repeat;
      background-size: 420px 300px;
      opacity: 0.5;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }

    .tag {
      color: var(--cyan);
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 24px 0;
      line-height: 1.3;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin: 8px 0;
      background: #0c0d12;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
    }

    input:focus {
      outline: none;
      border-color: var(--cyan);
    }

    input::placeholder { color: var(--text-dim); }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button:hover { opacity: 0.85; }

    .btn-primary {
      background: var(--orange);
      color: #fff;
    }

    .btn-secondary {
      background: transparent;
      color: var(--cyan);
      border: 1px solid var(--border);
    }

    #message {
      color: var(--orange);
      font-size: 0.8rem;
      margin-top: 12px;
      min-height: 1em;
    }

    #download-section { display: none; }

    #download-section p {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    a { text-decoration: none; }
  </style>
</head>
<body>

  <div class="card">

    <div id="auth-section">
      <div class="tag">BioAudit // Access</div>
      <h1>Sign up to download BioAudit</h1>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password (min 6 characters)" />
      <a href="signup.html"><button class="btn-primary" type="button">Sign Up</button></a>
      <button class="btn-secondary" id="login-btn">Already have an account? Log In</button>
      <p id="message"></p>
    </div>

    <div id="download-section">
      <div class="tag">BioAudit // Access Granted</div>
      <h1>You're signed in</h1>
      <p>Download BioAudit below to get started.</p>
      <a href="https://github.com/NasDoctorFish/Final_Year_Project/releases/download/v1.0.6/BioAudit.exe" download>
        <button class="btn-primary">Download BioAudit</button>
      </a>
      <button class="btn-secondary" id="logout-btn">Log Out</button>
    </div>

  </div>

  <!-- Load config FIRST -->
  <script src="firebase-config.js"></script>

  <!-- Then Firebase logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const app = initializeApp(window.firebaseConfig);
    const auth = getAuth(app);

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const messageEl = document.getElementById("message");
    const authSection = document.getElementById("auth-section");
    const downloadSection = document.getElementById("download-section");

    document.getElementById("login-btn").addEventListener("click", async () => {
      messageEl.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      } catch (err) {
        messageEl.textContent = err.message;
      }
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authSection.style.display = "none";
        downloadSection.style.display = "block";
      } else {
        authSection.style.display = "block";
        downloadSection.style.display = "none";
      }
    });
  </script>

</body>
</html>

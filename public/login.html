<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In | BioAudit</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* Same colours as the rest of the site */
    :root {
      --black: #000000;
      --mint: #EDFCEB;
      --orange: #FF6C3F;
      --line: #505050;
      --dim: #A9B3A9;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      background: var(--black);
      color: var(--mint);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Looping star video behind everything */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Logo back to the homepage */
    .top {
      position: relative;
      z-index: 1;
      padding: 28px clamp(20px, 4vw, 64px);
    }
    .top img { display: block; width: 96px; height: 96px; }

    .wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 80px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 44px 40px 40px;
      background: rgba(10, 12, 16, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--orange);
      border-radius: 10px;
    }

    h1 {
      font-weight: 400;
      font-size: 1.9rem;
      line-height: 1.2;
    }
    .lead {
      margin-top: 10px;
      color: var(--dim);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 24px;
      font-size: 0.85rem;
    }
    input {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--mint);
      font-family: inherit;
      font-size: 0.95rem;
    }
    input::placeholder { color: #7d877d; }
    input:focus { outline: none; border-color: var(--orange); }

    .btn {
      display: block;
      width: 100%;
      margin-top: 28px;
      padding: 13px;
      background: var(--orange);
      color: #000;
      border: 0;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn-ghost {
      background: transparent;
      color: var(--mint);
      border: 1px solid var(--line);
      margin-top: 12px;
    }
    .btn-ghost:hover { border-color: var(--mint); filter: none; }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 3px;
    }

    .switch {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--dim);
      text-align: center;
    }
    .switch a { color: var(--mint); }

    #message {
      margin-top: 14px;
      min-height: 1.2em;
      font-size: 0.85rem;
      color: var(--orange);
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-video { display: none; }
      body { background: #000 url("assets/bg-stars.jpg") center / cover fixed; }
    }
  </style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline poster="assets/bg-stars.jpg" aria-hidden="true">
    <source src="assets/bg-stars.mp4" type="video/mp4">
  </video>

  <header class="top">
    <a href="index.html"><img src="assets/favicon.png" alt="BioAudit home"></a>
  </header>

  <main class="wrap">
    <div class="card">

      <!-- Shown when signed out -->
      <form id="auth-section" novalidate>
        <h1>Log in to BioAudit</h1>
        <p class="lead">Log in to your BioAudit account.</p>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="current-password" required />

        <button class="btn" type="submit" id="login-btn">Log In</button>
        <p id="message" role="status"></p>

        <p class="switch">Don't have an account? <a href="signup.html">Sign up</a></p>
      </form>


    </div>
  </main>

  <!-- Load config FIRST -->
  <script src="firebase-config.js"></script>

  <!-- Then Firebase logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const app = initializeApp(window.firebaseConfig);
    const auth = getAuth(app);

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const messageEl = document.getElementById("message");
    const authSection = document.getElementById("auth-section");

    // Log in (button click or pressing Enter)
    authSection.addEventListener("submit", async (e) => {
      e.preventDefault();
      messageEl.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      } catch (err) {
        messageEl.textContent = err.message;
      }
    });

    // Signed in (just now, or from an earlier visit): go to the dashboard
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>

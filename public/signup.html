<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | BioAudit</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* Same colours as the rest of the site */
    :root {
      --black: #000000;
      --mint: #EDFCEB;
      --orange: #FF6C3F;
      --line: #505050;
      --dim: #A9B3A9;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      background: var(--black);
      color: var(--mint);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Looping star video behind everything */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Logo back to the homepage */
    .top {
      position: relative;
      z-index: 1;
      padding: 28px clamp(20px, 4vw, 64px);
    }
    .top img { display: block; width: 96px; height: 96px; }

    .wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 80px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      padding: 44px 40px 40px;
      background: rgba(10, 12, 16, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--orange);
      border-radius: 10px;
    }

    h1 {
      font-weight: 400;
      font-size: 1.9rem;
      line-height: 1.2;
    }
    .lead {
      margin-top: 10px;
      color: var(--dim);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    label.field {
      display: block;
      margin-top: 22px;
      font-size: 0.85rem;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--mint);
      font-family: inherit;
      font-size: 0.95rem;
    }
    input::placeholder { color: #7d877d; }
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus { outline: none; border-color: var(--orange); }

    /* Subscription choice */
    fieldset {
      border: 0;
      padding: 0;
      margin-top: 22px;
    }
    legend { font-size: 0.85rem; padding: 0; }
    .plans {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .plan-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.5);
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .plan-option:has(input:checked) { border-color: var(--orange); }
    .plan-option input { margin-top: 3px; accent-color: var(--orange); }
    .plan-option .price { display: block; color: var(--dim); font-size: 0.8rem; }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--dim);
      line-height: 1.4;
    }
    .checkbox-row input { margin-top: 3px; accent-color: var(--orange); }

    .btn {
      display: block;
      width: 100%;
      margin-top: 28px;
      padding: 13px;
      background: var(--orange);
      color: #000;
      border: 0;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.08); }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 3px;
    }

    #message {
      margin-top: 14px;
      min-height: 1.2em;
      font-size: 0.85rem;
      color: var(--orange);
    }

    .switch {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--dim);
      text-align: center;
    }
    .switch a { color: var(--mint); }

    @media (max-width: 480px) {
      .card { padding: 32px 22px; }
      .plans { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline poster="assets/bg-stars.jpg" aria-hidden="true">
    <source src="assets/bg-stars.mp4" type="video/mp4">
  </video>

  <header class="top">
    <a href="index.html"><img src="assets/favicon.png" alt="BioAudit home"></a>
  </header>

  <main class="wrap">
    <div class="card">
      <h1>Create account</h1>
      <p class="lead">Please provide your personal information to create your new account.</p>

      <form id="signup-form">
        <label class="field" for="fullName">Name *</label>
        <input type="text" id="fullName" autocomplete="name" required />

        <label class="field" for="email">Email address *</label>
        <input type="email" id="email" autocomplete="email" required />

        <label class="field" for="password">Password *</label>
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" required />

        <label class="field" for="confirmPassword">Confirm password *</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" required />

        <fieldset>
          <legend>Subscription type *</legend>
          <div class="plans">
            <label class="plan-option" for="sub-student">
              <input type="radio" name="subscription" id="sub-student" value="student" checked />
              <span>Student<span class="price">$0, valid for 12 months</span></span>
            </label>
            <label class="plan-option" for="sub-org">
              <input type="radio" name="subscription" id="sub-org" value="organisation" />
              <span>Organisation<span class="price">$34.99/year</span></span>
            </label>
          </div>
        </fieldset>

        <div id="org-name-field" style="display:none;">
          <label class="field" for="organisationName">Organisation name *</label>
          <input type="text" id="organisationName" placeholder="Give your organisation a name" />
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="terms" required />
          <label for="terms">I agree to the subscription terms and conditions. *</label>
        </div>

        <button class="btn" type="submit">Create account</button>
        <p id="message" role="status"></p>

        <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </div>
  </main>

  <!-- Load config FIRST -->
  <script src="firebase-config.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const app = initializeApp(window.firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("signup-form");
    const messageEl = document.getElementById("message");
    const orgNameField = document.getElementById("org-name-field");
    const orgNameInput = document.getElementById("organisationName");

    // Show/hide organisation name field based on subscription choice
    document.querySelectorAll('input[name="subscription"]').forEach((radio) => {
      radio.addEventListener("change", () => {
        const isOrg = document.querySelector('input[name="subscription"]:checked').value === "organisation";
        orgNameField.style.display = isOrg ? "block" : "none";
        orgNameInput.required = isOrg;
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      messageEl.textContent = "";

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const subscription = document.querySelector('input[name="subscription"]:checked').value;
      const isOrganisation = subscription === "organisation";
      const organisationName = isOrganisation ? orgNameInput.value.trim() : null;

      if (password !== confirmPassword) {
        messageEl.textContent = "Passwords do not match.";
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        await setDoc(doc(db, "users", uid), {
          displayName: fullName,
          email,
          organisationId: null,
          organisationName: organisationName,
          role: isOrganisation ? "admin" : "member",
          scanCount: 0,
          subscription: {
            status: "none",
            startedAt: null,
            cancelledAt: null
          },
          tier: isOrganisation ? "organisation" : "free",
          disabled: false,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        // New accounts are signed in straight away, so go to the dashboard
        window.location.href = "dashboard.html";

      } catch (err) {
        messageEl.textContent = err.message;
      }
    });
  </script>

</body>
</html>
